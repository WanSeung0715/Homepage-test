  <text x="108" y="431" fill="#596058" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="23">요즘은 AI 관제 대시보드를 배우는 중입니다.</text>

  <rect x="108" y="478" width="190" height="42" rx="21" fill="#e7eddb" />
