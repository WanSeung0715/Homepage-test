  </g>
  <circle cx="102" cy="76" r="7" fill="#83aa45" />
  <text x="123" y="82" fill="#19211c" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="18" font-weight="700" letter-spacing="2">WASUI</text>
  <text x="1108" y="82" fill="#737a72" font-family="Arial, sans-serif" font-size="12" letter-spacing="2" text-anchor="end">ENGINEER · ALWAYS LEARNING</text>

